<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Software Update — Background Animation v14</title>
<!--
  Software-update BACKGROUND ANIMATION — handoff v14
  Self-contained: no build step, no dependencies. Open directly in a browser.

  This file is the BACKDROP LAYER ONLY (no progress ring / text / buttons).
  Drop your own update UI on top of `.su-bg` — the content sits above it.

  Three ambient styles, all pure CSS (GPU transforms + blurred gradients):
    - aurora : soft drifting gradient blooms (calm, premium default)
    - stream : thin light trails falling — "downloading" feel
    - pulse  : gentle concentric sync rings radiating from centre

  INTEGRATION
  -----------
  1. Copy the `.su-bg*` CSS + one `<div class="su-bg ...">` block into your app.
  2. Position your content with a higher stacking context (e.g. z-index:1).
  3. Pick ONE style for production, or keep the switcher for review.
  4. Respects `prefers-reduced-motion` — animations disable automatically.

  Palette tokens (change to rebrand):
    --su-bg     page base        #0b1220
    --su-a      primary glow      #3b82f6
    --su-b      secondary glow    #6366f1
    --su-c      accent glow       #22d3ee
-->
<style>
  :root {
    --su-bg: #0b1220;
    --su-a: #3b82f6;
    --su-b: #6366f1;
    --su-c: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--su-bg); }

  /* ============================================================ backdrop === */
  .su-bg {
    position: fixed; inset: 0;
    overflow: hidden;
    background: var(--su-bg);
    pointer-events: none;      /* never intercept clicks meant for content */
  }
  /* ambient gradient wash shared by every style */
  .su-bg::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(90% 70% at 50% 10%, color-mix(in srgb, var(--su-b) 33%, transparent), transparent 60%),
      radial-gradient(80% 60% at 80% 100%, color-mix(in srgb, #6d28d9 33%, transparent), transparent 55%);
  }
  .su-layer { position: absolute; inset: 0; overflow: hidden; }
  .su-layer[hidden] { display: none; }

  /* ---- aurora ---- */
  .su-blob { position: absolute; border-radius: 9999px; filter: blur(90px); will-change: transform; }
  .su-blob.a { left: -96px; top: -96px; width: 460px; height: 460px;
    background: radial-gradient(circle, color-mix(in srgb, var(--su-a) 67%, transparent), transparent 70%);
    animation: su-aurora-a 14s ease-in-out infinite; }
  .su-blob.b { right: -80px; top: 33%; width: 420px; height: 420px;
    background: radial-gradient(circle, color-mix(in srgb, var(--su-b) 60%, transparent), transparent 70%);
    animation: su-aurora-b 16s ease-in-out infinite; }
  .su-blob.c { bottom: -120px; left: 33%; width: 400px; height: 400px;
    background: radial-gradient(circle, color-mix(in srgb, var(--su-c) 40%, transparent), transparent 70%);
    animation: su-aurora-a 18s ease-in-out 2s infinite; }
  @keyframes su-aurora-a { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(8%,6%) scale(1.15); } }
  @keyframes su-aurora-b { 0%,100% { transform: translate(0,0) scale(1.1); } 50% { transform: translate(-10%,-8%) scale(.9); } }

  /* ---- stream (downloading) ---- */
  .su-stream {
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 60%, transparent);
            mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 60%, transparent);
  }
  .su-trail { position: absolute; top: 0; width: 1px; will-change: transform;
    background: linear-gradient(to bottom, transparent, #7dd3fc); }
  @keyframes su-stream-fall {
    0% { transform: translateY(-140px); opacity: 0; }
    15%,80% { opacity: 1; }
    100% { transform: translateY(70vh); opacity: 0; }
  }

  /* ---- pulse (sync) ---- */
  .su-pulse { display: flex; align-items: center; justify-content: center; }
  .su-core { position: absolute; width: 300px; height: 300px; border-radius: 9999px; filter: blur(24px);
    background: radial-gradient(circle, color-mix(in srgb, var(--su-a) 33%, transparent), transparent 70%); }
  .su-ring { position: absolute; width: 560px; height: 560px; border-radius: 9999px;
    border: 1px solid color-mix(in srgb, var(--su-a) 25%, transparent); will-change: transform, opacity; }
  @keyframes su-pulse-ring { 0% { transform: scale(.35); opacity: .55; } 100% { transform: scale(1); opacity: 0; } }

  /* ============================================ demo-only switcher (remove) */
  .su-picker { position: fixed; top: 20px; right: 20px; z-index: 10; display: flex; gap: 4px; padding: 4px;
    border-radius: 9999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(6px); font-family: system-ui, sans-serif; }
  .su-picker button { border: 0; cursor: pointer; padding: 4px 12px; border-radius: 9999px; font-size: 12px;
    font-weight: 600; text-transform: capitalize; color: rgba(255,255,255,.7); background: transparent; transition: all .15s; }
  .su-picker button.on { background: rgba(255,255,255,.9); color: #0f172a; }
  .su-hint { position: fixed; left: 0; right: 0; bottom: 22px; z-index: 10; text-align: center;
    font-family: system-ui, sans-serif; font-size: 12px; color: rgba(255,255,255,.4); }

  @media (prefers-reduced-motion: reduce) {
    .su-blob, .su-trail, .su-ring { animation: none !important; }
  }
</style>
</head>
<body>
  <!-- ===================== BACKDROP LAYER (copy this) ===================== -->
  <div class="su-bg">
    <!-- aurora -->
    <div class="su-layer su-aurora" id="su-aurora">
      <div class="su-blob a"></div>
      <div class="su-blob b"></div>
      <div class="su-blob c"></div>
    </div>

    <!-- stream (trails injected by script; or hard-code <span class="su-trail">) -->
    <div class="su-layer su-stream" id="su-stream" hidden></div>

    <!-- pulse -->
    <div class="su-layer su-pulse" id="su-pulse" hidden>
      <div class="su-core"></div>
      <div class="su-ring" style="animation: su-pulse-ring 5.2s ease-out 0s infinite"></div>
      <div class="su-ring" style="animation: su-pulse-ring 5.2s ease-out 1.3s infinite"></div>
      <div class="su-ring" style="animation: su-pulse-ring 5.2s ease-out 2.6s infinite"></div>
      <div class="su-ring" style="animation: su-pulse-ring 5.2s ease-out 3.9s infinite"></div>
    </div>
  </div>
  <!-- =================== END BACKDROP LAYER =============================== -->

  <!-- demo chrome — delete for production -->
  <div class="su-picker" id="su-picker">
    <button data-bg="aurora" class="on">aurora</button>
    <button data-bg="stream">stream</button>
    <button data-bg="pulse">pulse</button>
  </div>
  <div class="su-hint">Backdrop layer only — place your update UI on top (z-index &gt; 0)</div>

<script>
(function () {
  "use strict";
  // Build the falling trails for the "stream" style.
  // (Static markup alternative: hard-code <span class="su-trail" style="..."> nodes.)
  var host = document.getElementById("su-stream");
  for (var i = 0; i < 18; i++) {
    var t = document.createElement("span");
    t.className = "su-trail";
    t.style.left = ((i * 5.5 + (i % 3) * 2) % 100) + "%";
    t.style.height = (60 + (i % 4) * 40) + "px";
    t.style.opacity = (0.25 + (i % 3) * 0.2).toString();
    t.style.animation = "su-stream-fall " + (3.2 + (i % 5) * 0.6) + "s linear " + ((i % 6) * 0.7) + "s infinite";
    host.appendChild(t);
  }

  // Demo-only style switcher (safe to remove with the .su-picker markup).
  var picker = document.getElementById("su-picker");
  picker.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var name = b.getAttribute("data-bg");
    ["aurora", "stream", "pulse"].forEach(function (n) {
      document.getElementById("su-" + n).hidden = n !== name;
    });
    Array.prototype.forEach.call(picker.children, function (c) { c.classList.toggle("on", c === b); });
  });
})();
</script>
</body>
</html>
